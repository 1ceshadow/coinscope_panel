<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三和妖币收割机 · 本地面板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0e0d; color: #d8e0dc; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; }
  header { position: sticky; top: 0; z-index: 10; background: #0d1412; border-bottom: 1px solid #1d2b27;
           padding: 12px 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 17px; color: #ffd479; font-weight: 700; }
  .meta { font-size: 12px; color: #6e827b; }
  .meta b { color: #9fe7c4; }
  .err { color: #ff6b6b; font-size: 12px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 18px; background: #0a100e; border-bottom: 1px solid #14201c; }
  .tab { padding: 5px 11px; border-radius: 999px; background: #16211d; color: #9fb3ab; cursor: pointer;
         font-size: 12px; border: 1px solid transparent; user-select: none; }
  .tab:hover { background: #1d2c27; }
  .tab.active { background: #1f4d3a; color: #b7ffd9; border-color: #2e7a59; }
  .tab .n { color: #ffd479; font-weight: 700; margin-left: 4px; }
  main { padding: 14px 18px 60px; }
  .section { margin-bottom: 26px; }
  .section h2 { font-size: 14px; color: #ffd479; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .section h2 .cnt { font-size: 11px; color: #6e827b; font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: right; padding: 6px 8px; color: #6e827b; font-weight: 600; border-bottom: 1px solid #1d2b27; white-space: nowrap; }
  th.l, td.l { text-align: left; }
  td { padding: 6px 8px; text-align: right; border-bottom: 1px solid #121d19; white-space: nowrap; }
  tr:hover td { background: #101916; }
  .tk { font-weight: 700; color: #e8f0ec; }
  .long { color: #4ade80; } .short { color: #f87171; }
  .pos { color: #4ade80; } .neg { color: #f87171; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; }
  .b-ignite { background: #4a2a0a; color: #ffb347; }
  .b-ready { background: #0a3a28; color: #5ce0a0; }
  .ready-bar { display: inline-block; width: 38px; height: 6px; background: #1d2b27; border-radius: 3px; overflow: hidden; vertical-align: middle; margin-left: 4px; }
  .ready-bar i { display: block; height: 100%; background: linear-gradient(90deg,#2e7a59,#5ce0a0); }
  .why { color: #7d918a; font-size: 11px; max-width: 320px; white-space: normal; text-align: left; }
  .dim { color: #56685f; }

  /* 交易页 */
  .view-toggle { display: flex; gap: 6px; margin-left: auto; }
  .vbtn { padding: 5px 14px; border-radius: 8px; background: #16211d; color: #9fb3ab; cursor: pointer; font-size: 13px; border: 1px solid #1d2b27; }
  .vbtn.active { background: #1f4d3a; color: #b7ffd9; border-color: #2e7a59; }
  .summary { display: flex; gap: 0; background: #0d1412; border: 1px solid #1d2b27; border-radius: 12px; padding: 18px 24px; margin-bottom: 18px; flex-wrap: wrap; }
  .summary .box { flex: 1; min-width: 130px; padding: 0 20px; border-right: 1px solid #1d2b27; }
  .summary .box:last-child { border-right: none; }
  .summary .big { font-size: 30px; font-weight: 800; line-height: 1.1; }
  .summary .lbl { font-size: 12px; color: #6e827b; margin-top: 6px; }
  .summary .teal { color: #2dd4bf; }
  .day-group { margin-bottom: 22px; }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #1d2b27; margin-bottom: 4px; }
  .day-head .date { font-size: 16px; font-weight: 700; color: #e8f0ec; }
  .day-head .sum { font-size: 13px; }
  .day-head .sum .cnt { color: #6e827b; margin-right: 10px; }
  .trade-row { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-bottom: 1px solid #121d19; }
  .trade-row .tname { min-width: 150px; }
  .trade-row .tname b { font-size: 14px; color: #e8f0ec; }
  .trade-row .tname small { color: #6e827b; margin-left: 6px; }
  .trade-row .sub { font-size: 12px; color: #8aa097; }
  .trade-row .lev { color: #ffd479; }
  .trade-row .pct { font-size: 15px; font-weight: 700; min-width: 80px; text-align: right; }
  .trade-row .usdt { min-width: 130px; text-align: right; font-weight: 600; }
  .trade-row .status { min-width: 70px; text-align: right; font-size: 12px; color: #6e827b; }
  .trade-row .rsn { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #16211d; color: #8aa097; }
  .open-badge { background: #0a3a28; color: #5ce0a0; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>🎯 三和妖币收割机</h1>
  <span class="meta">数据生成: <b id="gen">—</b></span>
  <span class="meta">本地更新: <b id="upd">—</b></span>
  <span class="meta">下次刷新: <b id="cd">—</b>s</span>
  <span class="err" id="err"></span>
  <span class="vbtn" id="refresh-cookie" onclick="refreshCookie()" style="display:none">🔄 刷新Cookie</span>
  <div class="view-toggle">
    <span class="vbtn active" id="vb-signals" onclick="switchView('signals')">📡 信号面板</span>
    <span class="vbtn" id="vb-trades" onclick="switchView('trades')">🎯 AI实盘交易展示</span>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<main id="main"><p class="dim">加载中…</p></main>
<div id="tradeview" class="hidden"><main id="trademain"><p class="dim">加载中…</p></main></div>

<script>
let REFRESH = 60;        // 页面拉取后端缓存的间隔(秒)
let activeTab = "ALL";
let lastData = null;

function fmtNum(v, digits=2) {
  if (v === null || v === undefined) return '<span class="dim">—</span>';
  const n = Number(v);
  if (Number.isNaN(n)) return '<span class="dim">—</span>';
  return n.toFixed(digits);
}
function fmtPct(v, digits=1) {
  if (v === null || v === undefined) return '<span class="dim">—</span>';
  const n = Number(v);
  const cls = n > 0 ? 'pos' : (n < 0 ? 'neg' : 'dim');
  const sign = n > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${n.toFixed(digits)}%</span>`;
}
function fmtPrice(v) {
  if (v === null || v === undefined) return '<span class="dim">—</span>';
  const n = Number(v);
  if (n >= 1) return n.toFixed(4);
  return n.toPrecision(4);
}
function readyCell(r) {
  if (r === null || r === undefined) return '<span class="dim">—</span>';
  return `${r}<span class="ready-bar"><i style="width:${Math.min(r,100)}%"></i></span>`;
}

function renderSection(sec) {
  let rows = sec.items.map(it => {
    const dirCls = it.directionCode === 'LONG' ? 'long' : (it.directionCode === 'SHORT' ? 'short' : '');
    const ignite = it.igniteActive ? `<span class="badge b-ignite">${it.igniteLabel||'点火'}</span>` : '';
    return `<tr>
      <td class="l tk">${it.ticker}</td>
      <td class="l ${dirCls}">${it.direction||''}</td>
      <td class="l">${it.stage||''} ${ignite}</td>
      <td>${fmtPrice(it.price)}</td>
      <td>${fmtPct(it.change24h)}</td>
      <td>${fmtPct(it.oi5m,2)}</td>
      <td>${fmtPct(it.oi1h)}</td>
      <td>${fmtPct(it.oi6h)}</td>
      <td>${fmtNum(it.fundingRate,5)}</td>
      <td>${it.longScore||0}/${it.shortScore||0}</td>
      <td>${readyCell(it.readiness)}</td>
      <td class="why">${it.why||''}</td>
    </tr>`;
  }).join('');
  return `<div class="section">
    <h2>${sec.label} <span class="cnt">${sec.count} 项</span></h2>
    <table>
      <thead><tr>
        <th class="l">币</th><th class="l">方向</th><th class="l">阶段</th>
        <th>价格</th><th>24h</th><th>OI5m</th><th>OI1h</th><th>OI6h</th>
        <th>费率</th><th>多/空</th><th>就绪</th><th class="l">理由</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function render() {
  if (!lastData || !lastData.sections) {
    document.getElementById('main').innerHTML = '<p class="dim">暂无数据</p>';
    return;
  }
  const tabsEl = document.getElementById('tabs');
  let tabsHtml = `<span class="tab ${activeTab==='ALL'?'active':''}" data-k="ALL">全部</span>`;
  tabsHtml += lastData.sections.map(s =>
    `<span class="tab ${activeTab===s.key?'active':''}" data-k="${s.key}">${s.label}<span class="n">${s.count}</span></span>`
  ).join('');
  tabsEl.innerHTML = tabsHtml;
  tabsEl.querySelectorAll('.tab').forEach(t => t.onclick = () => { activeTab = t.dataset.k; render(); });
  const secs = activeTab === 'ALL' ? lastData.sections : lastData.sections.filter(s => s.key === activeTab);
  document.getElementById('main').innerHTML = secs.map(renderSection).join('') || '<p class="dim">该板块暂无数据</p>';
}

async function loadData() {
  try {
    const r = await fetch('/api/data');
    const j = await r.json();
    document.getElementById('err').textContent = j.error || '';
    document.getElementById('upd').textContent = j.updated || '—';
    // 登录失效时显示"刷新Cookie"按钮
    const isLoginErr = j.error && j.error.indexOf('登录失效') >= 0;
    document.getElementById('refresh-cookie').style.display = isLoginErr ? 'inline-block' : 'none';
    if (j.data) {
      lastData = j.data;
      document.getElementById('gen').textContent = (j.data.generatedAt||'').replace('T',' ').slice(0,19);
      render();
    }
  } catch(e) {
    document.getElementById('err').textContent = '连接后端失败: ' + e;
  }
}

async function refreshCookie() {
  const btn = document.getElementById('refresh-cookie');
  btn.textContent = '🔄 抓取中...';
  try {
    const r = await fetch('/api/refresh-cookie');
    const j = await r.json();
    alert(j.ok ? ('Cookie已刷新: ' + j.msg + '\n稍候将自动重新抓取数据') : ('刷新失败: ' + j.msg + '\n\n请在 Chrome 浏览器重新登录 sanhe6.com 后再试'));
    if (j.ok) { setTimeout(loadData, 1000); }
  } catch(e) {
    alert('刷新出错: ' + e);
  }
  btn.textContent = '🔄 刷新Cookie';
}

let cd = REFRESH;
setInterval(() => {
  cd--;
  if (cd <= 0) { loadData(); loadTrades(); cd = REFRESH; }
  document.getElementById('cd').textContent = cd;
}, 1000);

// ===== 交易展示页 =====
let curView = 'signals';
function switchView(v) {
  curView = v;
  document.getElementById('vb-signals').classList.toggle('active', v==='signals');
  document.getElementById('vb-trades').classList.toggle('active', v==='trades');
  document.getElementById('main').classList.toggle('hidden', v!=='signals');
  document.getElementById('tabs').classList.toggle('hidden', v!=='signals');
  document.getElementById('tradeview').classList.toggle('hidden', v!=='trades');
  if (v==='trades') loadTrades();
}

function pctSpan(v) {
  const n = Number(v); const cls = n>=0?'pos':'neg'; const s=n>=0?'+':'';
  return `<span class="${cls}">${s}${n.toFixed(1)}%</span>`;
}
function usdtSpan(v) {
  const n = Number(v); const cls = n>=0?'pos':'neg'; const s=n>=0?'+':'';
  return `<span class="${cls}">${s}${n.toFixed(2)} USDT</span>`;
}
const REASON_LABEL = {take_profit:'止盈', stop_loss:'止损', liquidation:'爆仓', signal_gone:'信号消失'};

function fmtPx(v) {
  if (v === null || v === undefined) return '—';
  const n = Number(v);
  return n >= 1 ? n.toFixed(4) : n.toPrecision(4);
}
function tradeRow(t, isOpen) {
  const side = t.side==='long'?'做多':'做空';
  const pnl = t.pnl_pct;
  const usd = t.pnl_usdt;
  const status = isOpen ? '<span class="rsn open-badge">持仓中</span>'
                        : `已平仓 <span class="rsn">${REASON_LABEL[t.reason]||t.reason}</span>`;
  // 开仓信息
  const entryInfo = `开 ${t.opened_at||'—'} @ ${fmtPx(t.entry_price)}`;
  // 平仓信息(持仓中显示当前价)
  const exitInfo = isOpen
    ? `现价 @ ${fmtPx(t.cur_price)}`
    : `平 ${t.closed_at||'—'} @ ${fmtPx(t.exit_price)}`;
  return `<div class="trade-row">
    <div class="tname"><b>${t.ticker}</b><small>${side} <span class="lev">${t.leverage}x</span></small></div>
    <div class="sub" style="flex:1">
      <div>${entryInfo}</div>
      <div>${exitInfo}</div>
    </div>
    <div class="pct">${pctSpan(pnl)}</div>
    <div class="usdt">${usdtSpan(usd)}</div>
    <div class="status">${status}</div>
  </div>`;
}

function renderTrades(snap) {
  if (snap.error) { document.getElementById('trademain').innerHTML = `<p class="err">${snap.error}</p>`; return; }
  // 汇总卡
  let html = `<div class="summary">
    <div class="box"><div class="big">${snap.stats.total_trades}</div><div class="lbl">总交易 / 持仓中 ${snap.open.length}</div></div>
    <div class="box"><div class="big teal">${snap.total_return_pct>=0?'+':''}${snap.total_return_pct}%</div><div class="lbl">总收益率 (权益 ${snap.equity} USDT)</div></div>
    <div class="box"><div class="big">${snap.stats.wins}/${snap.stats.losses}</div><div class="lbl">胜/负 · 爆仓 ${snap.stats.liquidations}</div></div>
    <div class="box"><div class="big" style="font-size:20px">${snap.realized_pnl>=0?'+':''}${snap.realized_pnl}</div><div class="lbl">已实现盈亏 USDT</div></div>
    <div class="box"><div class="big" style="font-size:20px" class="">${snap.floating_pnl>=0?'+':''}${snap.floating_pnl}</div><div class="lbl">浮动盈亏 USDT</div></div>
  </div>`;
  // 持仓中
  if (snap.open.length) {
    html += `<div class="day-group"><div class="day-head"><span class="date">⚡ 当前持仓</span><span class="sum"><span class="cnt">${snap.open.length} 笔</span></span></div>`;
    html += snap.open.map(t => tradeRow(t, true)).join('');
    html += `</div>`;
  }
  // 历史按日期分组
  const groups = {};
  snap.closed.forEach(t => { (groups[t.open_date] = groups[t.open_date]||[]).push(t); });
  const dates = Object.keys(groups).sort().reverse();
  if (!dates.length && !snap.open.length) {
    html += `<p class="dim" style="padding:20px 0">还没有交易记录。机器人正在后台等待信号触发，开仓后会出现在这里。</p>`;
  }
  dates.forEach(d => {
    const arr = groups[d];
    const daySum = arr.reduce((s,t)=>s+t.pnl_usdt,0);
    const dayPct = arr.reduce((s,t)=>s+t.pnl_pct,0);
    html += `<div class="day-group"><div class="day-head">
      <span class="date">${d}</span>
      <span class="sum"><span class="cnt">${arr.length} 笔</span>${pctSpan(dayPct)} &nbsp; ${usdtSpan(daySum)}</span>
    </div>`;
    html += arr.map(t => tradeRow(t, false)).join('');
    html += `</div>`;
  });
  document.getElementById('trademain').innerHTML = html;
}

async function loadTrades() {
  try {
    const r = await fetch('/api/trades');
    const snap = await r.json();
    renderTrades(snap);
  } catch(e) {
    document.getElementById('trademain').innerHTML = `<p class="err">加载交易数据失败: ${e}</p>`;
  }
}

loadData();
</script>
</body>
</html>
